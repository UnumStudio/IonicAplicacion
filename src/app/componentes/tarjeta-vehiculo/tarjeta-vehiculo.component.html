<article class="tarjeta" [class.activa]="activo" (click)="onSeleccionar()">

  <!-- Foto + datos principales -->
  <div class="principal">
    <img
      class="foto"
      [src]="vehiculo.fotoUrl"
      [alt]="'Ver detalle de ' + vehiculo.marca + ' ' + vehiculo.modelo"
      (click)="onVerDetalle($event)"
    />

    <div class="datos">
      <h3 class="nombre">{{ vehiculo.marca }} {{ vehiculo.modelo }}</h3>

      <div class="fila-patente">
        <span class="patente">{{ vehiculo.patente }}</span>
        @if (activo) {
          <span class="etiqueta-activo">Activo</span>
        }
      </div>

      <span class="detalle">{{ detalle }}</span>
    </div>

    <button
      type="button"
      class="boton-editar"
      aria-label="Editar vehículo"
      (click)="onEditar($event)"
    >
      <ion-icon name="pencil-outline"></ion-icon>
    </button>
  </div>

  <!-- Indicadores: combustible y próximo service -->
  <div class="indicadores">
    <div class="indicador">
      <div class="indicador-fila">
        <ion-icon name="water-outline" class="indicador-icono"></ion-icon>
        <div class="indicador-texto">
          <span class="indicador-etiqueta">Combustible</span>
          <span class="indicador-valor">{{ nivelCombustibleTexto }}</span>
        </div>
      </div>
      <div class="barra">
        <div
          class="barra-relleno"
          [class.bajo]="combustibleBajo"
          [style.width.%]="nivelCombustible ?? 0"
        ></div>
      </div>
    </div>

    <div class="indicador">
      <div class="indicador-fila">
        <ion-icon name="build-outline" class="indicador-icono"></ion-icon>
        <div class="indicador-texto">
          <span class="indicador-etiqueta">Próximo service</span>
          <span class="indicador-valor">{{ proximoServiceFormateado }}</span>
        </div>
        <ion-icon name="chevron-forward" class="indicador-flecha"></ion-icon>
      </div>
    </div>
  </div>

</article>
