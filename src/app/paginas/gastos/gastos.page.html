<ion-content [fullscreen]="true" class="fondo">
  <div class="contenedor">

    <div class="encabezado">
      <h2>Gastos</h2>
      <ion-button size="small" routerLink="/paginas/agregar-gasto">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Agregar gastos
      </ion-button>
    </div>

    <div class="fila-filtros">
      @for (filtro of filtros; track filtro.valor) {
        <button
          class="chip-filtro"
          [class.activo]="filtroActivo === filtro.valor"
          (click)="seleccionarFiltro(filtro.valor)"
        >
          {{ filtro.etiqueta }}
        </button>
      }
    </div>

    <div class="lista-gastos">
      @for (gasto of gastosFiltrados; track gasto.id) {
        <app-tarjeta-gasto [gasto]="gasto"></app-tarjeta-gasto>
      } @empty {
        <p class="vacio">No hay gastos en esta categoría todavía.</p>
      }
    </div>

  </div>

  <app-barra-navegacion></app-barra-navegacion>
</ion-content>
