<ion-content [fullscreen]="true" class="fondo">
  <div class="contenedor">

    <header class="encabezado">
      <ion-icon name="car-outline" class="icono-titulo"></ion-icon>
      <div>
        <h1>Mis vehículos</h1>
        <p>Gestioná y consultá tus vehículos</p>
      </div>
    </header>

    <div class="lista-vehiculos">
      @for (vehiculo of vehiculos(); track vehiculo.id) {
        <app-tarjeta-vehiculo
          [vehiculo]="vehiculo"
          [activo]="vehiculo.id === vehiculoActivo()?.id"
          (seleccionar)="seleccionarActivo($event)"
          (verDetalle)="verDetalle($event)"
          (editar)="editarVehiculo($event)"
        ></app-tarjeta-vehiculo>
      } @empty {
        <p class="vacio">Todavía no agregaste ningún vehículo.</p>
      }
    </div>

    <button type="button" class="boton-agregar" routerLink="/paginas/agregar-vehiculo">
      <ion-icon name="add-outline"></ion-icon>
      Agregar vehículo
    </button>

  </div>

  <app-barra-navegacion></app-barra-navegacion>
</ion-content>
