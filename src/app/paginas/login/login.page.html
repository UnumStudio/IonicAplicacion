<ion-content [fullscreen]="true" class="fondo">
  <div class="contenedor">

    <div class="marca">
      <ion-icon name="car-sport-outline"></ion-icon>
      <h1>Mi Vehículo</h1>
      <p>Iniciá sesión para seguir con tus gastos y documentos</p>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()" class="formulario">
      <div class="campo">
        <label for="email">Email</label>
        <ion-input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          fill="outline"
        ></ion-input>
        <span
          class="error"
          *ngIf="formulario.get('email')?.invalid && formulario.get('email')?.touched"
        >
          Ingresá un email válido.
        </span>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <ion-input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          fill="outline"
        ></ion-input>
        <span
          class="error"
          *ngIf="formulario.get('password')?.invalid && formulario.get('password')?.touched"
        >
          Mínimo 4 caracteres.
        </span>
      </div>

      <p class="error error-general" *ngIf="errorLogin()">{{ errorLogin() }}</p>

      <ion-button type="submit" expand="block" [disabled]="enviando()">
        Iniciar sesión
      </ion-button>
    </form>

    <p class="pie">
      ¿No tenés cuenta?
      <a routerLink="/paginas/registro">Registrate</a>
    </p>

  </div>
</ion-content>
